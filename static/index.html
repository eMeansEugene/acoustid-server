<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcoustID</title>
<style>
  :root {
    --bg: #08080e;
    --surface: #12121e;
    --border: #1e1e30;
    --accent: #00d4aa;
    --accent-glow: rgba(0, 212, 170, 0.15);
    --accent-dim: #008866;
    --text: #e0e0ec;
    --text-secondary: #6a6a82;
    --danger: #ff4466;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  .header { padding: 2rem 0 0.5rem; text-align: center; }
  .header h1 {
    font-size: 1.4rem; font-weight: 600;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent);
  }
  .header p { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.3rem; }

  /* --- Listen button --- */
  .listen-area {
    display: flex; flex-direction: column; align-items: center;
    padding: 2.5rem 0 1.5rem; transition: opacity 0.3s;
  }
  .listen-btn {
    width: 140px; height: 140px; border-radius: 50%;
    border: 2px solid var(--accent-dim);
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease; outline: none;
  }
  .listen-btn:hover {
    border-color: var(--accent);
    box-shadow: 0 0 40px var(--accent-glow);
  }
  .listen-btn.recording {
    border-color: var(--danger);
    background: radial-gradient(circle, rgba(255,68,102,0.12) 0%, transparent 70%);
    animation: pulse-ring 1.5s ease-in-out infinite;
  }
  .listen-btn svg { width: 40px; height: 40px; }
  .listen-btn .mic-icon { fill: var(--accent); transition: fill 0.3s; }
  .listen-btn.recording .mic-icon { fill: var(--danger); }
  .listen-btn .stop-icon { display: none; fill: var(--danger); }
  .listen-btn.recording .mic-icon { display: none; }
  .listen-btn.recording .stop-icon { display: block; }

  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(255,68,102,0.3); }
    70%  { box-shadow: 0 0 0 25px rgba(255,68,102,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,68,102,0); }
  }

  .listen-label {
    margin-top: 1rem; font-size: 0.85rem;
    color: var(--text-secondary); min-height: 1.2em;
  }
  .upload-row { margin-top: 1rem; display: flex; align-items: center; gap: 0.5rem; }
  .upload-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text-secondary); padding: 0.45rem 1rem;
    border-radius: 6px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
  }
  .upload-btn:hover { border-color: var(--accent-dim); color: var(--text); }
  #file-input { display: none; }

  /* --- Spectrum canvas --- */
  .viz-area {
    width: 100%; max-width: 700px; padding: 0 1rem;
    display: none;
  }
  .viz-area.visible { display: block; }

  #spectrum-canvas {
    width: 100%; height: 200px;
    border-radius: 10px;
    background: transparent;
  }

  /* --- Status --- */
  .status-area { text-align: center; padding: 1rem 0; min-height: 3rem; }
  .status-text { font-size: 0.85rem; color: var(--text-secondary); }
  .status-text.processing { color: var(--accent); }
  .dots::after { content: ''; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots {
    0% { content: ''; } 25% { content: '.'; }
    50% { content: '..'; } 75% { content: '...'; }
  }

  /* --- Result card --- */
  .result-card {
    width: 100%; max-width: 700px; margin: 0.5rem 1rem 2rem;
    padding: 1.5rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px;
    display: none; animation: slide-up 0.4s ease-out;
  }
  .result-card.visible { display: block; }
  .result-card.no-match { border-color: var(--text-secondary); }
  .result-card.matched { border-color: var(--accent); }

  @keyframes slide-up {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.2rem; }
  .result-artist { font-size: 1rem; color: var(--accent); margin-bottom: 1rem; }
  .result-meta { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .meta-item { display: flex; flex-direction: column; }
  .meta-label {
    font-size: 0.65rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-secondary);
  }
  .meta-value {
    font-size: 1rem; font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--text); margin-top: 0.15rem;
  }
  .no-match-text { font-size: 1.1rem; color: var(--text-secondary); text-align: center; padding: 0.5rem 0; }

  .try-again-btn {
    margin-top: 1rem; background: none; border: 1px solid var(--border);
    color: var(--text-secondary); padding: 0.5rem 1.5rem; border-radius: 6px;
    font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
    display: block; width: fit-content;
  }
  .try-again-btn:hover { border-color: var(--accent); color: var(--text); }
</style>
</head>
<body>

<div class="header">
  <h1>AcoustID</h1>
  <p>audio fingerprinting</p>
</div>

<div class="listen-area" id="listen-area">
  <button class="listen-btn" id="listen-btn" title="Tap to listen">
    <svg class="mic-icon" viewBox="0 0 24 24">
      <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm-1-9a1 1 0 1 1 2 0v6a1 1 0 1 1-2 0V5zm-4 6a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.93V20h3v2H8v-2h3v-2.07A7 7 0 0 1 5 11h2z"/>
    </svg>
    <svg class="stop-icon" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="2"/>
    </svg>
  </button>
  <div class="listen-label" id="listen-label">Tap to listen</div>
  <div class="upload-row">
    <button class="upload-btn" id="upload-btn">or upload a file</button>
    <input type="file" id="file-input" accept="audio/*">
  </div>
</div>

<div class="viz-area" id="viz-area">
  <canvas id="spectrum-canvas"></canvas>
</div>

<div class="status-area">
  <div class="status-text" id="status-text"></div>
</div>

<div class="result-card" id="result-card">
  <div id="result-content"></div>
  <button class="try-again-btn" id="try-again-btn">Try again</button>
</div>

<script>
const API_BASE = window.location.origin;

const listenBtn = document.getElementById('listen-btn');
const listenLabel = document.getElementById('listen-label');
const uploadBtn = document.getElementById('upload-btn');
const fileInput = document.getElementById('file-input');
const vizArea = document.getElementById('viz-area');
const spectrumCanvas = document.getElementById('spectrum-canvas');
const statusText = document.getElementById('status-text');
const resultCard = document.getElementById('result-card');
const resultContent = document.getElementById('result-content');
const tryAgainBtn = document.getElementById('try-again-btn');
const listenArea = document.getElementById('listen-area');

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let liveAnimFrame = null;
let audioCtx = null;
let analyser = null;
let liveStream = null;
let recordingTimeout = null;
const MAX_RECORDING_SEC = 20;

// --- Spectrum drawing ---

function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = spectrumCanvas.getBoundingClientRect();
  spectrumCanvas.width = rect.width * dpr;
  spectrumCanvas.height = rect.height * dpr;
  const ctx = spectrumCanvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, w: rect.width, h: rect.height };
}

function drawSpectrum(ctx, w, h, data, count, opts = {}) {
  const { live = false, glow = true } = opts;

  ctx.clearRect(0, 0, w, h);

  // Сколько бинов рисуем (нижняя четверть спектра — музыкально значимая)
  const bins = Math.min(count, Math.floor(count / (live ? 2 : 4)));
  if (bins < 2) return;

  // Нормализация
  let maxVal = 0;
  for (let i = 0; i < bins; i++) {
    if (data[i] > maxVal) maxVal = data[i];
  }
  if (maxVal === 0) maxVal = 1;

  // Точки кривой — логарифмическое распределение по x
  const points = [];
  const numPoints = Math.min(bins, 128);
  for (let i = 0; i < numPoints; i++) {
    // Логарифмическая шкала частот
    const logPos = Math.pow(i / numPoints, 1.6) * bins;
    const idx = Math.min(Math.floor(logPos), bins - 1);

    // Усреднение окрестных бинов для плавности
    const radius = Math.max(1, Math.floor(bins / numPoints));
    let sum = 0, cnt = 0;
    for (let j = Math.max(0, idx - radius); j <= Math.min(bins - 1, idx + radius); j++) {
      sum += data[j]; cnt++;
    }
    const avg = sum / cnt;
    const norm = avg / maxVal;

    const x = (i / (numPoints - 1)) * w;
    const y = h - norm * h * 0.85 - h * 0.02;
    points.push({ x, y });
  }

  // Плавная кривая через catmull-rom → bezier
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);

  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[Math.max(0, i - 1)];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[Math.min(points.length - 1, i + 2)];

    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;

    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
  }

  // Градиентная заливка под кривой
  const fillGrad = ctx.createLinearGradient(0, 0, 0, h);
  fillGrad.addColorStop(0, 'rgba(0, 212, 170, 0.15)');
  fillGrad.addColorStop(0.7, 'rgba(0, 212, 170, 0.03)');
  fillGrad.addColorStop(1, 'transparent');

  const linePath = new Path2D();
  linePath.moveTo(points[0].x, points[0].y);
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[Math.max(0, i - 1)];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[Math.min(points.length - 1, i + 2)];
    linePath.bezierCurveTo(
      p1.x + (p2.x - p0.x) / 6, p1.y + (p2.y - p0.y) / 6,
      p2.x - (p3.x - p1.x) / 6, p2.y - (p3.y - p1.y) / 6,
      p2.x, p2.y
    );
  }

  // Fill area
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, h);
  ctx.lineTo(points[0].x, points[0].y);
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[Math.max(0, i - 1)];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[Math.min(points.length - 1, i + 2)];
    ctx.bezierCurveTo(
      p1.x + (p2.x - p0.x) / 6, p1.y + (p2.y - p0.y) / 6,
      p2.x - (p3.x - p1.x) / 6, p2.y - (p3.y - p1.y) / 6,
      p2.x, p2.y
    );
  }
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fillStyle = fillGrad;
  ctx.fill();
  ctx.restore();

  // Neon line
  if (glow) {
    ctx.save();
    ctx.shadowColor = '#00d4aa';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#00d4aa';
    ctx.lineWidth = 2;
    ctx.stroke(linePath);
    ctx.restore();

    // Second pass — brighter core
    ctx.save();
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 4;
    ctx.strokeStyle = 'rgba(0, 255, 204, 0.8)';
    ctx.lineWidth = 1;
    ctx.stroke(linePath);
    ctx.restore();
  } else {
    ctx.strokeStyle = '#00d4aa';
    ctx.lineWidth = 1.5;
    ctx.stroke(linePath);
  }
}

// --- Live spectrum during recording ---

function drawLiveSpectrum() {
  if (!isRecording || !analyser) return;
  liveAnimFrame = requestAnimationFrame(drawLiveSpectrum);

  const { ctx, w, h } = setupCanvas();
  const bufLen = analyser.frequencyBinCount;
  const data = new Uint8Array(bufLen);
  analyser.getByteFrequencyData(data);
  drawSpectrum(ctx, w, h, data, bufLen, { live: true, glow: true });
}

// --- Static spectrum from audio buffer ---

async function renderStaticSpectrum(blob) {
  const arrayBuffer = await blob.arrayBuffer();
  const offCtx = new OfflineAudioContext(1, 1, 44100);
  let audioBuffer;
  try {
    audioBuffer = await offCtx.decodeAudioData(arrayBuffer);
  } catch(e) {
    console.warn('Cannot decode for viz:', e);
    return;
  }

  const samples = audioBuffer.getChannelData(0);
  const fftSize = 4096;
  const hop = 2048;
  const numFrames = Math.floor((samples.length - fftSize) / hop) + 1;
  const numBins = fftSize / 2;

  if (numFrames <= 0) return;

  // Средний спектр по всем фреймам
  const avgSpectrum = new Float64Array(numBins);
  const real = new Float32Array(fftSize);
  const imag = new Float32Array(fftSize);

  for (let f = 0; f < numFrames; f++) {
    real.fill(0); imag.fill(0);
    for (let i = 0; i < fftSize; i++) {
      const w = 0.5 * (1 - Math.cos(2 * Math.PI * i / fftSize));
      real[i] = samples[f * hop + i] * w;
    }
    fft(real, imag, fftSize);

    for (let b = 0; b < numBins; b++) {
      const r = real[b + 1], im = imag[b + 1];
      avgSpectrum[b] += Math.sqrt(r * r + im * im);
    }
  }
  for (let b = 0; b < numBins; b++) avgSpectrum[b] /= numFrames;

  // Анимированная отрисовка — кривая «растёт» снизу
  vizArea.classList.add('visible');
  const { ctx, w, h } = setupCanvas();
  const totalSteps = 40;
  let step = 0;

  function animate() {
    step++;
    const progress = Math.min(1, step / totalSteps);
    const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic

    const scaled = new Float64Array(numBins);
    for (let b = 0; b < numBins; b++) scaled[b] = avgSpectrum[b] * eased;

    const { ctx: c, w: ww, h: hh } = setupCanvas();
    drawSpectrum(c, ww, hh, scaled, numBins, { live: false, glow: true });

    if (step < totalSteps) requestAnimationFrame(animate);
  }
  animate();
}

// Simple Cooley-Tukey FFT
function fft(real, imag, n) {
  let j = 0;
  for (let i = 0; i < n; i++) {
    if (i < j) {
      [real[i], real[j]] = [real[j], real[i]];
      [imag[i], imag[j]] = [imag[j], imag[i]];
    }
    let m = n >> 1;
    while (m >= 1 && j >= m) { j -= m; m >>= 1; }
    j += m;
  }
  for (let size = 2; size <= n; size *= 2) {
    const half = size / 2;
    const angle = -2 * Math.PI / size;
    const wR = Math.cos(angle), wI = Math.sin(angle);
    for (let i = 0; i < n; i += size) {
      let curR = 1, curI = 0;
      for (let k = 0; k < half; k++) {
        const tR = curR * real[i+k+half] - curI * imag[i+k+half];
        const tI = curR * imag[i+k+half] + curI * real[i+k+half];
        real[i+k+half] = real[i+k] - tR;
        imag[i+k+half] = imag[i+k] - tI;
        real[i+k] += tR;
        imag[i+k] += tI;
        const newR = curR * wR - curI * wI;
        curI = curR * wI + curI * wR;
        curR = newR;
      }
    }
  }
}

// --- Recording ---

async function startRecording() {
  try {
    // Запрашиваем микрофон с принудительным 44100 Гц моно.
    liveStream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: 44100, channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    audioCtx = new AudioContext({ sampleRate: 44100 });
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.75;

    const source = audioCtx.createMediaStreamSource(liveStream);
    source.connect(analyser);

    // Захват сырого PCM через ScriptProcessorNode (без кодирования в WebM).
    const bufferSize = 4096;
    const scriptNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
    audioChunks = [];

    scriptNode.onaudioprocess = (e) => {
      if (!isRecording) return;
      // Копируем float-сэмплы — они приходят чистые, без сжатия.
      const input = e.inputBuffer.getChannelData(0);
      audioChunks.push(new Float32Array(input));
    };

    source.connect(scriptNode);
    scriptNode.connect(audioCtx.destination);

    isRecording = true;
    listenBtn.classList.add('recording');
    vizArea.classList.add('visible');
    drawLiveSpectrum();

    let remaining = MAX_RECORDING_SEC;
    listenLabel.textContent = 'Listening... ' + remaining + 's';
    recordingTimeout = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        stopRecording();
      } else {
        listenLabel.textContent = 'Listening... ' + remaining + 's';
      }
    }, 1000);
  } catch (err) {
    listenLabel.textContent = 'Microphone access denied';
    console.error(err);
  }
}

function stopRecording() {
  if (recordingTimeout) { clearInterval(recordingTimeout); recordingTimeout = null; }
  isRecording = false;
  listenBtn.classList.remove('recording');
  listenLabel.textContent = '';
  if (liveAnimFrame) cancelAnimationFrame(liveAnimFrame);

  if (liveStream) {
    liveStream.getTracks().forEach(t => t.stop());
  }

  // Собрать PCM-сэмплы в один WAV без промежуточных форматов.
  if (audioChunks.length > 0) {
    const blob = pcmChunksToWav(audioChunks, audioCtx ? audioCtx.sampleRate : 44100);
    audioChunks = [];
    processAudio(blob);
  }
}

/// Упаковывает массив Float32Array чанков в WAV-blob напрямую.
function pcmChunksToWav(chunks, sampleRate) {
  // Общее число сэмплов
  let totalSamples = 0;
  for (const chunk of chunks) totalSamples += chunk.length;

  const buffer = new ArrayBuffer(44 + totalSamples * 2);
  const view = new DataView(buffer);

  function writeStr(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  // WAV header
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + totalSamples * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);              // PCM
  view.setUint16(22, 1, true);              // mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);  // byte rate
  view.setUint16(32, 2, true);              // block align
  view.setUint16(34, 16, true);             // 16 bit
  writeStr(36, 'data');
  view.setUint32(40, totalSamples * 2, true);

  // PCM data — float32 → int16 без промежуточных кодеков.
  let offset = 44;
  for (const chunk of chunks) {
    for (let i = 0; i < chunk.length; i++) {
      const s = Math.max(-1, Math.min(1, chunk[i]));
      view.setInt16(offset, s * 32767, true);
      offset += 2;
    }
  }

  return new Blob([buffer], { type: 'audio/wav' });
}

// --- Listen button ---

listenBtn.addEventListener('click', () => {
  if (isRecording) { stopRecording(); }
  else { resetUI(); startRecording(); }
});

// --- Upload ---

uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  resetUI();
  processAudio(file);
  fileInput.value = '';
});

// --- Process audio ---

async function processAudio(blob) {
  listenArea.style.opacity = '0.4';
  listenArea.style.pointerEvents = 'none';
  setStatus('Analyzing audio...', false);

  // Render averaged spectrum client-side
  try { await renderStaticSpectrum(blob); } catch(e) { console.warn(e); }

  // Определить имя файла по типу.
  const type = blob.type || '';
  let filename = 'audio.wav';
  if (type.includes('mp3') || type.includes('mpeg')) filename = 'audio.mp3';

  // Send to server
  setStatus('Identifying', true);
  try {
    const formData = new FormData();
    formData.append('file', blob, filename);

    const matchRes = await fetch(API_BASE + '/match', { method: 'POST', body: formData });
    if (!matchRes.ok) throw new Error('Server error: ' + matchRes.status);
    const { task_id } = await matchRes.json();

    const result = await pollResult(task_id);
    showResult(result);
  } catch (err) {
    setStatus('Error: ' + err.message, false);
    listenArea.style.opacity = '1';
    listenArea.style.pointerEvents = 'auto';
  }
}

// --- Polling ---

async function pollResult(taskId) {
  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, 500));
    const res = await fetch(API_BASE + '/tasks/' + taskId);
    if (!res.ok) throw new Error('Poll error: ' + res.status);
    const data = await res.json();
    if (data.status === 'done') return data;
    if (data.status === 'error') throw new Error(data.error || 'Processing error');
  }
  throw new Error('Timeout');
}

// --- Result ---

function showResult(data) {
  setStatus('', false);
  listenArea.style.opacity = '1';
  listenArea.style.pointerEvents = 'auto';
  resultCard.classList.remove('matched', 'no-match');

  if (data.result) {
    const r = data.result;
    const track = r.track || {};
    const offsetSec = (r.offset_frames * 1024 / 44100).toFixed(1);
    resultContent.innerHTML =
      '<div class="result-title">' + (track.title || 'Unknown') + '</div>' +
      '<div class="result-artist">' + (track.artist || 'Unknown') + '</div>' +
      '<div class="result-meta">' +
        '<div class="meta-item"><span class="meta-label">Position</span><span class="meta-value">' + offsetSec + 's</span></div>' +
        '<div class="meta-item"><span class="meta-label">Score</span><span class="meta-value">' + (r.score != null ? r.score.toFixed(1) + '×' : r.votes) + '</span></div>' +
        '<div class="meta-item"><span class="meta-label">Votes</span><span class="meta-value">' + r.votes + '</span></div>' +
      '</div>';
    resultCard.classList.add('matched');
  } else {
    resultContent.innerHTML = '<div class="no-match-text">No match found</div>';
    resultCard.classList.add('no-match');
  }
  resultCard.classList.add('visible');
}

function setStatus(text, processing) {
  statusText.textContent = text;
  statusText.className = 'status-text' + (processing ? ' processing dots' : '');
}

function resetUI() {
  resultCard.classList.remove('visible', 'matched', 'no-match');
  vizArea.classList.remove('visible');
  setStatus('', false);
}

tryAgainBtn.addEventListener('click', () => {
  resetUI();
  listenArea.style.opacity = '1';
  listenArea.style.pointerEvents = 'auto';
});
</script>
</body>
</html>
